server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        text/svg+xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Iframe-embedding compatibility:
    #   - DO NOT set X-Frame-Options.
    #   - frame-ancestors * lets any origin embed us.
    add_header Content-Security-Policy "frame-ancestors *;" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html: never cache so deploys are visible immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Security-Policy "frame-ancestors *;" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Vite-hashed assets: aggressive immutable cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "frame-ancestors *;" always;
        try_files $uri =404;
    }

    # Lightweight health check endpoint (also `/` returns 200).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
